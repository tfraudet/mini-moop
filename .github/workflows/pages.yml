# Builds the presentation site (site/, Astro) and publishes it on GitHub Pages:
# https://tfraudet.github.io/mini-moop/
# Runs when the site changes on main, when a release is published or changed
# (the download buttons are read from the latest release at build time), or by
# hand from the Actions tab. Needs Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release event runs on its tag, and the github-pages environment only
  # deploys from main: start this workflow again on main instead.
  on-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rebuild the site from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Build
        # The token lifts the API rate limit for reading the latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
